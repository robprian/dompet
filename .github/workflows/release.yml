name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Target Release Tag (e.g. v0.1.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Validate tag format
        run: |
          if ! echo "${{ steps.tag.outputs.value }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must match vMAJOR.MINOR.PATCH (e.g. v0.1.0)"
            exit 1
          fi

      - name: Validate pubspec version matches tag
        run: |
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          APP_VERSION="${PUBSPEC_VERSION%%+*}"
          EXPECTED="v$APP_VERSION"
          echo "pubspec version: $PUBSPEC_VERSION (app: $APP_VERSION)"
          if [ "$EXPECTED" != "${{ steps.tag.outputs.value }}" ]; then
            echo "Tag ${{ steps.tag.outputs.value }} does not match pubspec app version $APP_VERSION"
            exit 1
          fi

      - name: Require release signing secrets
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required secret: $secret_name"
              exit 1
            fi
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          rm -f lib/i18n/*.g.dart
          dart run build_runner build
          dart run slang
          # Mirror `make generate`: format everything so committed code
          # matches builder output + current SDK formatter exactly.
          dart format lib test
          # Slang embeds a volatile generation timestamp in strings.g.dart.
          # Compare it timestamp-normalized on BOTH sides; diff the rest normally.
          git show HEAD:lib/i18n/strings.g.dart \
            | sed -E 's#^/// Built on .*$#/// Built on NORMALIZED#' > /tmp/strings_head.dart
          sed -E 's#^/// Built on .*$#/// Built on NORMALIZED#' lib/i18n/strings.g.dart > /tmp/strings_work.dart
          if ! diff -q /tmp/strings_head.dart /tmp/strings_work.dart > /dev/null; then
            echo 'lib/i18n/strings.g.dart is stale. Run: make generate'
            diff /tmp/strings_head.dart /tmp/strings_work.dart | head -20
            exit 1
          fi
          git diff --exit-code -- lib test ':!lib/i18n/strings.g.dart' \
            || (echo 'Generated code is stale. Run: make generate' && exit 1)

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: make test

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_STRING" | base64 -d > android/app/keystore.jks
          test -s android/app/keystore.jks || (echo 'Decoded keystore is empty' && exit 1)

      - name: Resolve keystore alias and create key.properties
        id: signing
        env:
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE="android/app/keystore.jks"
          # Secrets are typed by humans: normalise stray CR/space so a trailing
          # newline cannot silently become part of the alias.
          SECRET_KEY_ALIAS=$(printf '%s' "${SECRET_KEY_ALIAS:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          # 1. List every alias actually contained in the keystore. keytool
          #    prints errors on stdout for some failure modes, so the command
          #    must succeed AND every candidate must be re-verified before we
          #    trust it as an alias.
          LIST_OUT=$(keytool -list -keystore "$KEYSTORE" \
            -storepass "$ANDROID_STORE_PASSWORD" 2>&1) || {
            echo 'Unable to read the keystore. ANDROID_STORE_PASSWORD is likely'
            echo 'wrong, or ANDROID_KEYSTORE_BASE64 is not a valid JKS/PKCS12 file.'
            echo "$LIST_OUT"
            echo 'Regenerate a matching set with: bash scripts/keystore.sh'
            exit 1
          }

          ALIASES=$(printf '%s\n' "$LIST_OUT" \
            | sed -n 's/^\([^,]*\),.*Entry.*$/\1/p' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -v '^$' || true)

          # Keep only aliases that keytool itself confirms exist.
          VERIFIED_ALIASES=""
          for candidate in $ALIASES; do
            if keytool -list -keystore "$KEYSTORE" \
              -storepass "$ANDROID_STORE_PASSWORD" \
              -alias "$candidate" > /dev/null 2>&1; then
              VERIFIED_ALIASES="${VERIFIED_ALIASES}${candidate}"$'\n'
            fi
          done
          ALIASES=$(printf '%s' "$VERIFIED_ALIASES" | grep -v '^$' || true)

          if [ -z "$ALIASES" ]; then
            echo 'Could not read any alias from the keystore. The store password'
            echo 'is likely wrong, or the keystore file is not valid.'
            echo 'Regenerate a matching set with: bash scripts/keystore.sh'
            exit 1
          fi

          echo "Aliases found in keystore:"
          echo "$ALIASES" | sed 's/^/  - /'

          # 2. Prefer the configured secret alias when it is valid; otherwise
          #    fall back to the keystore's alias so a stale secret cannot break
          #    an otherwise perfectly valid release build.
          RESOLVED_ALIAS=""
          if [ -n "${SECRET_KEY_ALIAS:-}" ] && echo "$ALIASES" | grep -qxF "$SECRET_KEY_ALIAS"; then
            RESOLVED_ALIAS="$SECRET_KEY_ALIAS"
            echo "Using alias from ANDROID_KEY_ALIAS secret: '$RESOLVED_ALIAS'"
          else
            ALIAS_COUNT=$(echo "$ALIASES" | wc -l | tr -d ' ')
            if [ "$ALIAS_COUNT" != "1" ]; then
              echo "ANDROID_KEY_ALIAS='${SECRET_KEY_ALIAS:-}' does not match any alias," \
                "and the keystore has $ALIAS_COUNT aliases so it cannot be auto-resolved."
              echo "Update ANDROID_KEY_ALIAS to one of the aliases listed above."
              exit 1
            fi
            RESOLVED_ALIAS="$ALIASES"
            echo "ANDROID_KEY_ALIAS secret is missing or stale; auto-resolved to" \
              "the only keystore alias: '$RESOLVED_ALIAS'"
          fi

          # 3. Verify the key password unlocks the resolved key before building.
          #    Importing into a throwaway PKCS12 store validates the key password
          #    without mutating the release keystore.
          rm -f /tmp/dompet-verify.p12
          if ! keytool -importkeystore \
            -srckeystore "$KEYSTORE" -srcalias "$RESOLVED_ALIAS" \
            -srcstorepass "$ANDROID_STORE_PASSWORD" \
            -srckeypass "$ANDROID_KEY_PASSWORD" \
            -destkeystore /tmp/dompet-verify.p12 -deststoretype PKCS12 \
            -deststorepass verifypass -destkeypass verifypass -noprompt \
            > /dev/null 2>&1; then
            rm -f /tmp/dompet-verify.p12
            echo "ANDROID_KEY_PASSWORD cannot unlock key '$RESOLVED_ALIAS'."
            echo 'Set ANDROID_KEY_PASSWORD to the password used when the key was created.'
            exit 1
          fi
          rm -f /tmp/dompet-verify.p12

          # 4. Write key.properties with the resolved alias. trim any accidental
          #    trailing CR/newline so Gradle never sees an invalid alias value.
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$RESOLVED_ALIAS" \
            > android/key.properties
          echo "alias=$RESOLVED_ALIAS" >> "$GITHUB_OUTPUT"
          echo "Release signing configured for alias '$RESOLVED_ALIAS'."

          # 5. If the secret differs from what we used, surface it loudly so the
          #    secret can be corrected without blocking the release.
          if [ "${SECRET_KEY_ALIAS:-}" != "$RESOLVED_ALIAS" ]; then
            echo "::warning title=Stale ANDROID_KEY_ALIAS::Secret contains '${SECRET_KEY_ALIAS:-}' but the keystore only has '$RESOLVED_ALIAS'. Update the secret to avoid future confusion."
          fi

      - name: Build release APK
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          flutter build apk --release --dart-define=APP_VERSION="$TAG"

      - name: Validate and rename APK
        id: apk
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          VERSION="${TAG#v}"
          APK_DIR="build/app/outputs/flutter-apk"
          SRC="$APK_DIR/app-release.apk"
          DEST="$APK_DIR/Dompet-$TAG.apk"

          test -s "$SRC" || (echo "Release APK missing or empty: $SRC" && exit 1)
          mv "$SRC" "$DEST"

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -1)
          test -n "$AAPT" || (echo 'aapt not found in Android SDK build-tools' && exit 1)
          BADGING=$("$AAPT" dump badging "$DEST")
          echo "$BADGING" | head -2

          APK_PACKAGE=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          APK_VERSION=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "package=$APK_PACKAGE versionName=$APK_VERSION"

          if [ "$APK_PACKAGE" != 'dev.robprian.dompet' ]; then
            echo "Unexpected package id: $APK_PACKAGE"
            exit 1
          fi
          if [ "$APK_VERSION" != "$VERSION" ]; then
            echo "APK versionName $APK_VERSION does not match tag $TAG"
            exit 1
          fi

          sha256sum "$DEST" | awk '{print $1}' > "$DEST.sha256"
          echo "SHA256: $(cat "$DEST.sha256")"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          echo "checksum=$DEST.sha256" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          PREVIOUS=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo '')
          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..$TAG"
          else
            RANGE="$TAG"
          fi
          {
            echo "# Dompet $TAG"
            echo ''
            echo '## Highlights'
            echo ''
            git log --pretty='- %s' "$RANGE" | head -50
            echo ''
            echo '## Privacy'
            echo ''
            echo 'All financial processing remains local on your device. No cloud sync, no remote AI.'
            echo ''
            echo '## APK'
            echo ''
            echo "Dompet-$TAG.apk"
            echo ''
            echo 'SHA256:'
            echo '```'
            cat "${{ steps.apk.outputs.checksum }}"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Dompet ${{ steps.tag.outputs.value }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.checksum }}

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/keystore.jks android/key.properties
