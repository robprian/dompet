name: Keystore Diagnostic

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decode keystore
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_STRING" | base64 -d > /tmp/debug.jks
          test -s /tmp/debug.jks || (echo 'Decoded keystore is empty' && exit 1)

      - name: List aliases
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          echo "=== keytool -list ==="
          keytool -list -keystore /tmp/debug.jks -storepass "$ANDROID_STORE_PASSWORD" 2>&1
          echo ""
          echo "Secret alias length: ${#ANDROID_KEY_ALIAS}"
          echo "Secret alias (masked by GitHub unless it is safe): [$ANDROID_KEY_ALIAS]"
          echo "Store password length: ${#ANDROID_STORE_PASSWORD}"
          echo "Key password length: ${#ANDROID_KEY_PASSWORD}"
          echo "Regex sanitized alias:"
          printf '%s' "$ANDROID_KEY_ALIAS" | od -c | head -5
