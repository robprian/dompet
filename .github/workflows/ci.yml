name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify generated code is up to date
        run: |
          rm -f lib/i18n/*.g.dart
          dart run build_runner build
          dart run slang
          # Slang embeds a volatile generation timestamp in strings.g.dart.
          # Compare it timestamp-normalized on BOTH sides; diff the rest normally.
          git show HEAD:lib/i18n/strings.g.dart \
            | sed -E 's#^/// Built on .*$#/// Built on NORMALIZED#' > /tmp/strings_head.dart
          sed -E 's#^/// Built on .*$#/// Built on NORMALIZED#' lib/i18n/strings.g.dart > /tmp/strings_work.dart
          if ! diff -q /tmp/strings_head.dart /tmp/strings_work.dart > /dev/null; then
            echo 'lib/i18n/strings.g.dart is stale. Run: make generate'
            diff /tmp/strings_head.dart /tmp/strings_work.dart | head -20
            exit 1
          fi
          git diff --exit-code -- lib test ':!lib/i18n/strings.g.dart' \
            || (echo 'Generated code is stale. Run: make generate' && exit 1)

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Check Formatting & Lints
        run: make check

  test:
    needs: analyze
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        test-suite: [unit, feature]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: make test:${{ matrix.test-suite }}

  build:
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build debug APK (validation only)
        run: flutter build apk --debug
